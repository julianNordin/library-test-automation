# The test database.
#
# One definition, used identically by a developer running the suite locally and by CI. If
# those two ever diverge, "works on my machine" becomes possible again — which is the whole
# failure mode this project exists to rule out. CI therefore runs this same file rather than
# a GitHub service container.

name: librarysystem-e2e

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: librarysystem-test-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env - copy .env.example}
    ports:
      - "1433:1433"
    volumes:
      - db-data:/var/opt/mssql
    healthcheck:
      # The container is listening long before the engine accepts connections — typically
      # 20-40 seconds on a cold start. Waiting on "container running" instead of this check
      # is the classic way to get a login-failed error that looks like a bad password.
      #
      # The password is read from the container's own environment rather than passed in, so
      # it never reaches the host's process list or shell history.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$MSSQL_SA_PASSWORD -C -Q 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  db-data:
